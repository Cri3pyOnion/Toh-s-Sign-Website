# Publishes the static redesign/ folder to GitHub Pages as a temporary preview.
# The WordPress theme/ is not deployed here (Pages cannot run PHP).
name: Deploy redesign preview to Pages

on:
  push:
    branches: [main]
    paths: ["redesign/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redesign
      - id: deployment
        uses: actions/deploy-pages@v4
